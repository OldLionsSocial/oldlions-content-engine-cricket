name: Ingest photos

# Every 30 minutes: picks up new photos in the Drive Photo Library, strips location data,
# makes cut-outs of studio shots and updates the photo index.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: photo-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.rembg
          key: rembg-models-v1
      - name: Install background removal
        run: pip install "rembg[cpu]" opencv-python-headless numpy pillow

      - name: Ingest
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/ingest.js
